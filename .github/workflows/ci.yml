name: Python Backend CI

on:
  push:
    branches: ["main", "api-hardening-and-docs"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Compile backend source
        run: python -m compileall -q src/backend
      - name: Run source contract tests
        run: pytest -q
